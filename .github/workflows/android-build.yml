
name: AIZ3N Frida Agent Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile AIZ3N Agent
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Source
        run: |
          test -f agent.ts || {
            echo "ERROR: agent.ts not found"
            exit 1
          }

      - name: Initialize Project
        run: |
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile

      - name: Compile TypeScript
        run: |
          mkdir -p build
          npx frida-compile agent.ts -o build/agent.js

      - name: Generate Embedded Header
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd
          xxd -i build/agent.js > build/agent.h

      - name: Verify Build
        run: |
          test -s build/agent.js
          test -s build/agent.h
          echo "Agent compilation successful"
          ls -lh build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-Frida-Agent
          path: |
            build/agent.js
            build/agent.h
          if-no-files-found: error
          retention-days: 30
