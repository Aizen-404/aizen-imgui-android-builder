
name: AIZ3N Native ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AIZ3N Native Library
    runs-on: ubuntu-22.04

    env:
      FRIDA_VERSION: "17.11.0"
      ANDROID_API: "24"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;23.2.8568313"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            xz-utils \
            python3 \
            file

      - name: Verify Agent Source
        run: |
          test -s agent.ts || {
            echo "ERROR: agent.ts not found"
            exit 1
          }

      - name: Compile JavaScript Agent
        run: |
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile
          mkdir -p build
          npx frida-compile agent.ts -o build/agent.js
          test -s build/agent.js

      - name: Download Frida Gum Devkit
        run: |
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gum-devkit-${FRIDA_VERSION}-android-arm64.tar.xz"

          wget -O frida-devkit.tar.xz "$URL"

          mkdir -p frida-devkit
          tar -xf frida-devkit.tar.xz -C frida-devkit

          test -f frida-devkit/frida-gum.h
          test -f frida-devkit/libfrida-gum.a

      - name: Convert Agent to C Header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data = Path("build/agent.js").read_bytes()

          output = [
              "#pragma once",
              "static const unsigned char agent_js[] = {"
          ]

          for i in range(0, len(data), 16):
              chunk = data[i:i + 16]
              output.append(
                  "    " + ", ".join(f"0x{b:02x}" for b in chunk) + ","
              )

          output.extend([
              "};",
              f"static const unsigned int agent_js_len = {len(data)};"
          ])

          Path("build/agent_blob.h").write_text(
              "\n".join(output) + "\n"
          )
          PY

      - name: Create Native Source
        run: |
          cat > build/native.cpp <<'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <pthread.h>
          #include "frida-gum.h"
          #include "agent_blob.h"

          #define LOG_TAG "AIZ3N"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static void* initialize_runtime(void*) {
              LOGI("Initializing Frida Gum 17.11.0");

              gum_init_embedded();

              LOGI("Frida Gum initialized.");

              LOGI("Embedded JavaScript size: %u bytes", agent_js_len);

              return nullptr;
          }

          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void* reserved) {
              LOGI("AIZ3N JNI_OnLoad called.");

              pthread_t thread;

              if (pthread_create(
                  &thread,
                  nullptr,
                  initialize_runtime,
                  nullptr
              ) != 0) {
                  LOGE("Runtime thread creation failed.");
                  return JNI_ERR;
              }

              pthread_detach(thread);

              return JNI_VERSION_1_6;
          }
          EOF

      - name: Compile libaizen.so
        run: |
          NDK="$ANDROID_HOME/ndk/23.2.8568313"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -std=c++17 \
            -shared \
            -fPIC \
            -O2 \
            -Ibuild \
            -Ifrida-devkit \
            build/native.cpp \
            -Lfrida-devkit \
            -lfrida-gum \
            -llog \
            -landroid \
            -ldl \
            -lz \
            -pthread \
            -o build/libaizen.so

      - name: Verify Build
        run: |
          test -s build/libaizen.so
          file build/libaizen.so
          ls -lh build/libaizen.so

          "$ANDROID_HOME/ndk/23.2.8568313/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/libaizen.so

      - name: Upload Native Library
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-Frida-17.11.0-ARM64
          path: build/libaizen.so
          if-no-files-found: error
          retention-days: 30
