
name: AIZ3N Single SO Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build build-essential \
            python3 unzip wget xxd curl pkg-config

      - name: Install Android NDK
        run: |
          mkdir -p "$HOME/android"
          cd "$HOME/android"
          wget -q https://dl.google.com/android/repository/android-ndk-r23c-linux.zip
          unzip -q android-ndk-r23c-linux.zip
          echo "ANDROID_NDK_HOME=$HOME/android/android-ndk-r23c" >> "$GITHUB_ENV"

      - name: Compile TypeScript
        run: |
          test -f agent.ts
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile
          mkdir -p build native
          npx frida-compile agent.ts -o build/agent.js
          xxd -i build/agent.js > build/agent.h

      - name: Download Frida GumJS ARM64 Devkit
        run: |
          VERSION=17.11.0
          URL="https://github.com/frida/frida/releases/download/$VERSION/frida-gumjs-devkit-$VERSION-android-arm64.tar.xz"

          mkdir -p "$HOME/frida-gumjs"

          curl -fL "$URL" -o "$HOME/frida-gumjs/devkit.tar.xz"

          tar -xJf "$HOME/frida-gumjs/devkit.tar.xz" \
            -C "$HOME/frida-gumjs"

          test -f "$HOME/frida-gumjs/frida-gumjs.h"
          test -f "$HOME/frida-gumjs/libfrida-gumjs.a"

          echo "FRIDA_GUMJS_INCLUDE_DIR=$HOME/frida-gumjs" >> "$GITHUB_ENV"
          echo "FRIDA_GUMJS_LIBRARY=$HOME/frida-gumjs/libfrida-gumjs.a" >> "$GITHUB_ENV"

      - name: Generate Native Loader
        run: |
          cat > native/loader.cpp <<'EOF'
          #include <frida-gumjs.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <string>
          #include "agent.h"

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO,"AIZ3N",__VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR,"AIZ3N",__VA_ARGS__)

          static GumScript *script = nullptr;

          static void on_message(
              GumScript *,
              const gchar *message,
              GBytes *,
              gpointer
          ) {
              LOGI("%s", message);
          }

          static void *initialize(void *) {
              GError *error = nullptr;

              gum_init_embedded();

              GumScriptBackend *backend = gum_script_backend_obtain_qjs();

              if (!backend) {
                  LOGE("QuickJS backend unavailable");
                  return nullptr;
              }

              std::string source(
                  reinterpret_cast<const char *>(build_agent_js),
                  build_agent_js_len
              );

              script = gum_script_backend_create_sync(
                  backend,
                  "AIZ3N",
                  source.c_str(),
                  nullptr,
                  nullptr,
                  &error
              );

              if (!script) {
                  LOGE("Script creation failed: %s",
                      error ? error->message : "unknown");

                  if (error)
                      g_error_free(error);

                  return nullptr;
              }

              gum_script_set_message_handler(
                  script,
                  on_message,
                  nullptr,
                  nullptr
              );

              gum_script_load_sync(script, nullptr);

              LOGI("AIZ3N agent loaded");

              return nullptr;
          }

          __attribute__((constructor))
          static void start() {
              pthread_t thread;

              if (pthread_create(&thread, nullptr, initialize, nullptr) == 0) {
                  pthread_detach(thread);
                  LOGI("Native initialization started");
              } else {
                  LOGE("Thread creation failed");
              }
          }
          EOF

      - name: Generate CMake Configuration
        run: |
          cat > native/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(AIZ3N LANGUAGES C CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          add_library(AIZ3N SHARED loader.cpp)

          target_include_directories(AIZ3N PRIVATE
              "${FRIDA_GUMJS_INCLUDE_DIR}"
              "${CMAKE_CURRENT_SOURCE_DIR}/../build"
          )

          target_link_libraries(AIZ3N PRIVATE
              "${FRIDA_GUMJS_LIBRARY}"
              log
              android
              dl
              m
              z
              resolv
          )

          set_target_properties(AIZ3N PROPERTIES
              OUTPUT_NAME AIZ3N
              LIBRARY_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/out"
          )
          EOF

      - name: Build ARM64 Library
        run: |
          cmake -S native -B build/native -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static

          cmake --build build/native --parallel 2

      - name: Verify Library
        run: |
          LIB=build/native/out/libAIZ3N.so

          test -s "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:|Machine:'
          readelf -d "$LIB"

          mkdir -p release
          cp "$LIB" release/libAIZ3N.so

      - name: Upload Final SO Only
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-ARM64
          path: release/libAIZ3N.so
          if-no-files-found: error
          retention-days: 30
