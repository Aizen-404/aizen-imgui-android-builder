
name: Build ImGui Android Vulkan Hook

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Clone upstream project
        run: git clone --depth 1 https://github.com/Kaotic/ImGuiAndroidVulkanHook.git upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 ndk;23.2.8568313 cmake;3.22.1

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Fix missing iterator include
        working-directory: upstream
        run: |
          sed -i '1i#include <iterator>' Menu/Menu.cpp

      - name: Configure project
        working-directory: upstream
        run: |
          test -f CMakeLists.txt
          NDK="$ANDROID_SDK_ROOT/ndk/23.2.8568313"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        working-directory: upstream
        run: cmake --build build --parallel 2

      - name: Upload shared libraries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiAndroidVulkanHook-arm64-v8a
          path: upstream/build/**/*.so
          if-no-files-found: error
