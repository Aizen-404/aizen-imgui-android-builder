
name: Clone and Build Android ImGui

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone original project
        uses: actions/checkout@v4
        with:
          repository: traitimtrongvag/Android-Imgui-Template
          ref: main
          path: source
          submodules: recursive

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build ARM64 library
        working-directory: source
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=app/src/main \
            APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
            NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
            APP_ABI=arm64-v8a

      - name: Upload compiled libraries
        uses: actions/upload-artifact@v4
        with:
          name: Android-ImGui-ARM64
          path: source/app/src/main/libs/**/*.so
          if-no-files-found: error
          retention-days: 14
