
name: AIZ3N Frida Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile

      - name: Compile TypeScript Agent
        run: |
          mkdir -p build
          npx frida-compile agent.ts -o build/agent.js

      - name: Generate Embedded Agent Header
        run: |
          xxd -i build/agent.js > build/agent.h

      - name: Package Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-Agent-ARM64
          path: |
            build/agent.js
            build/agent.h
          if-no-files-found: error
