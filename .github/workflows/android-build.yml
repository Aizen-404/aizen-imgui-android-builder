name: AIZ3N Native ARM64 Build

on:
  workflow_dispatch:
  push:
  _branches: # Note: keep branches indented properly below push
    - main

permissions:
  contents: read

jobs:
  build:
    name: Prepare AIZ3N Native Engine
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 build-essential clang cmake ninja-build pkg-config xxd

      - name: Install Android NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;23.2.8568313"

      - name: Verify Agent Source
        run: |
          test -f agent.ts || {
            echo "ERROR: agent.ts not found"
            exit 1
          }

      - name: Initialize Project
        run: |
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile

      - name: Compile Agent
        run: |
          mkdir -p build
          npx frida-compile agent.ts -o build/agent.js
          xxd -i build/agent.js > build/agent.h

      - name: Verify ARM64 Toolchain
        run: |
          export NDK="$ANDROID_HOME/ndk/23.2.8568313"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOLCHAIN/aarch64-linux-android24-clang" --version
          "$TOOLCHAIN/aarch64-linux-android24-clang++" --version

      - name: Verify Build
        run: |
          test -s build/agent.js
          test -s build/agent.h
          echo "AIZ3N preparation successful"
          ls -lh build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-Native-ARM64
          path: |
            build/agent.js
            build/agent.h
          if-no-files-found: error
          retention-days: 30
          
