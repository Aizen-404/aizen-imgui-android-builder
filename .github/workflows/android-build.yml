
name: AIZ3N Native ARM64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build AIZ3N Native Library
    runs-on: ubuntu-22.04

    env:
      FRIDA_VERSION: "17.11.0"
      ANDROID_API: "24"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            xz-utils \
            python3 \
            file

      - name: Verify Agent Source
        run: |
          test -s agent.ts || {
            echo "ERROR: agent.ts not found"
            exit 1
          }

      - name: Compile JavaScript Agent
        run: |
          npm init -y
          npm install frida-il2cpp-bridge
          npm install --save-dev frida-compile

          mkdir -p build

          npx frida-compile agent.ts -o build/agent.js

          test -s build/agent.js

          echo "Agent compilation successful."
          ls -lh build/agent.js

      - name: Download Frida GumJS Devkit
        run: |
          URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-gumjs-devkit-${FRIDA_VERSION}-android-arm64.tar.xz"

          wget -O frida-gumjs-devkit.tar.xz "$URL"

          mkdir -p frida-devkit
          tar -xf frida-gumjs-devkit.tar.xz -C frida-devkit

          HEADER=$(find frida-devkit -name frida-gumjs.h -print -quit)
          LIBRARY=$(find frida-devkit -name libfrida-gumjs.a -print -quit)

          if [ -z "$HEADER" ] || [ -z "$LIBRARY" ]; then
            echo "ERROR: GumJS devkit files are missing."
            find frida-devkit -maxdepth 4 -type f
            exit 1
          fi

          echo "GUMJS_INCLUDE=$(dirname "$HEADER")" >> "$GITHUB_ENV"
          echo "GUMJS_LIB=$(dirname "$LIBRARY")" >> "$GITHUB_ENV"

          echo "GumJS header: $HEADER"
          echo "GumJS library: $LIBRARY"

      - name: Convert Agent to Native Header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data = Path("build/agent.js").read_bytes()

          lines = [
              "#pragma once",
              "static const unsigned char agent_js[] = {"
          ]

          for i in range(0, len(data), 16):
              chunk = data[i:i + 16]
              lines.append("    " + ", ".join(
                  f"0x{b:02x}" for b in chunk
              ) + ",")

          lines.extend([
              "    0x00",
              "};",
              f"static const unsigned int agent_js_len = {len(data)};"
          ])

          Path("build/agent_blob.h").write_text(
              "\n".join(lines) + "\n"
          )
          PY

          test -s build/agent_blob.h

      - name: Create Native Initialization Source
        run: |
          cat > build/native.cpp <<'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <pthread.h>
          #include <frida-gumjs.h>
          #include "agent_blob.h"

          #define LOG_TAG "AIZ3N"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static void on_message(
              const gchar* message,
              GBytes* data,
              gpointer user_data
          ) {
              LOGI("GumJS: %s", message != nullptr ? message : "(empty)");
          }

          static void* run_agent(void* arg) {
              LOGI("Initializing embedded GumJS...");

              gum_init_embedded();

              GumScriptBackend* backend =
                  gum_script_backend_obtain_qjs();

              if (backend == nullptr) {
                  LOGE("QuickJS backend unavailable.");
                  return nullptr;
              }

              GError* error = nullptr;

              gchar* source = g_strndup(
                  reinterpret_cast<const gchar*>(agent_js),
                  agent_js_len
              );

              GumScript* script =
                  gum_script_backend_create_sync(
                      backend,
                      "AIZ3N",
                      source,
                      nullptr,
                      nullptr,
                      &error
                  );

              g_free(source);

              if (script == nullptr) {
                  LOGE("Script creation failed: %s",
                      error != nullptr ? error->message : "Unknown error");

                  if (error != nullptr)
                      g_error_free(error);

                  return nullptr;
              }

              gum_script_set_message_handler(
                  script,
                  on_message,
                  nullptr,
                  nullptr
              );

              gum_script_load_sync(script, nullptr);

              LOGI("Embedded agent loaded successfully.");

              GMainContext* context = g_main_context_default();

              while (true) {
                  g_main_context_iteration(context, true);
              }

              return nullptr;
          }

          extern "C" JNIEXPORT jint JNICALL
          JNI_OnLoad(JavaVM* vm, void* reserved) {
              LOGI("AIZ3N library loaded.");

              pthread_t thread;

              if (pthread_create(
                  &thread,
                  nullptr,
                  run_agent,
                  nullptr
              ) != 0) {
                  LOGE("Failed to create runtime thread.");
                  return JNI_ERR;
              }

              pthread_detach(thread);

              return JNI_VERSION_1_6;
          }
          EOF

      - name: Compile libaizen.so
        run: |
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -std=c++17 \
            -shared \
            -fPIC \
            -O2 \
            -fvisibility=hidden \
            -static-libstdc++ \
            -Ibuild \
            -I"$GUMJS_INCLUDE" \
            build/native.cpp \
            -L"$GUMJS_LIB" \
            -lfrida-gumjs \
            -llog \
            -landroid \
            -lz \
            -ldl \
            -lm \
            -pthread \
            -Wl,--no-undefined \
            -o build/libaizen.so

          test -s build/libaizen.so

      - name: Verify Native Library
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          LIB="build/libaizen.so"

          test -s "$LIB"

          echo "========== FILE =========="
          file "$LIB"

          echo "========== ELF HEADER =========="
          "$TOOLCHAIN/llvm-readelf" -h "$LIB"

          echo "========== ELF DEPENDENCIES =========="
          "$TOOLCHAIN/llvm-readelf" -d "$LIB"

          if "$TOOLCHAIN/llvm-readelf" -d "$LIB" | grep -q 'libc++_shared.so'; then
            echo "ERROR: libc++_shared.so dependency detected."
            exit 1
          fi

          echo "========== SYMBOL CHECK =========="
          "$TOOLCHAIN/llvm-nm" -D --undefined-only "$LIB" || true

          echo "========== RESULT =========="
          echo "Static C++ runtime dependency check passed."

          ls -lh "$LIB"

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-ARM64-Frida-${{ env.FRIDA_VERSION }}
          path: build/libaizen.so
          if-no-files-found: error
          retention-days: 30
