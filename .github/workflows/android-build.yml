name: AIZ3N Frida ARM64 Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git curl wget python3 python3-pip \
        build-essential clang lld ninja-build \
        pkg-config libglib2.0-dev \
        flex bison autoconf automake libtool

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android NDK
    run: |
      sdkmanager "platform-tools" "platforms;android-35" "ndk;23.2.8568313"

  - name: Checkout Frida 17.11.0
    run: |
      git clone --branch 17.11.0 --recurse-submodules \
        https://github.com/frida/frida.git frida

  - name: Verify environment
    run: |
      node --version
      npm --version
      java -version
      python3 --version
      git -C frida describe --tags --always
      ls "$ANDROID_HOME/ndk/23.2.8568313"

  - name: Upload source
    uses: actions/upload-artifact@v4
    with:
      name: AIZ3N-Frida-17.11.0-Source
      path: frida/
      retention-days: 3
