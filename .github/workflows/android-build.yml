
name: Build ImGuiAndroidVulkanHook

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Clone upstream repository
        run: git clone --depth 1 https://github.com/Kaotic/ImGuiAndroidVulkanHook.git upstream

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;23.2.8568313" "cmake;3.22.1"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3

      - name: Fix std::size compatibility
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Menu/Menu.cpp")
          s = p.read_text()
          old = "std::size(pool_sizes)"
          if old in s:
              s = s.replace(old, "(sizeof(pool_sizes) / sizeof(pool_sizes[0]))")
              p.write_text(s)
          PY

      - name: Fix OpenGL ES linking
        working-directory: upstream
        run: |
          grep -q 'target_link_libraries(Menu' CMakeLists.txt || true
          printf '\ntarget_link_libraries(Menu PRIVATE GLESv3 EGL)\n' >> CMakeLists.txt

      - name: Configure CMake
        working-directory: upstream
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/23.2.8568313
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: upstream
        run: cmake --build build --parallel 2

      - name: Upload shared libraries
        uses: actions/upload-artifact@v4
        with:
          name: ImGuiAndroidVulkanHook-arm64-v8a
          path: upstream/build/**/*.so
          if-no-files-found: error
